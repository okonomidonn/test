name: Seed Demo Company Account + Job Listing

# Manual-only: creates a demo company account and one job listing directly
# on the live server via WordPress's own functions (wp_insert_user,
# wp_insert_post), so the chat/auto-reply feature can be tested end-to-end
# on the real site. Idempotent — safe to re-run, skips creation if the
# demo account/job already exist.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create demo company account + job listing (idempotent)
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} bash -s <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd zaito-work.com/public_html

          php <<'PHP_SCRIPT'
          <?php
          require_once( __DIR__ . '/wp-load.php' );

          $email = 'demo-company@zaito-work.com';
          $company_name = 'テスト株式会社（デモ）';

          $user = get_user_by( 'email', $email );
          if ( ! $user ) {
              $password = wp_generate_password( 12, false );
              $user_id = wp_insert_user( array(
                  'user_email' => $email,
                  'user_login' => 'demo-company',
                  'user_pass'  => $password,
                  'first_name' => '採用担当',
                  'role'       => 'zaito_company',
              ) );
              if ( is_wp_error( $user_id ) ) {
                  echo "ERROR creating user: " . $user_id->get_error_message() . "\n";
                  exit( 1 );
              }
              update_user_meta( $user_id, 'company_name', $company_name );
              update_user_meta( $user_id, 'company_phone', '03-0000-0000' );
              update_user_meta( $user_id, 'zaito_email_verified', '1' );
              echo "ACCOUNT_STATUS=created\n";
              echo "LOGIN_EMAIL=$email\n";
              echo "LOGIN_PASSWORD=$password\n";
          } else {
              $user_id = $user->ID;
              echo "ACCOUNT_STATUS=already_existed\n";
              echo "LOGIN_EMAIL=$email\n";
              echo "LOGIN_PASSWORD=(unchanged, not shown)\n";
          }

          $existing_jobs = get_posts( array(
              'post_type'      => 'job_listing',
              'posts_per_page' => 1,
              'meta_key'       => '_company_user_id',
              'meta_value'     => $user_id,
          ) );

          if ( empty( $existing_jobs ) ) {
              $job_id = wp_insert_post( array(
                  'post_type'    => 'job_listing',
                  'post_title'   => 'カスタマーサポート（在宅・デモ求人）',
                  'post_content' => 'お客様からのお問い合わせ対応（チャット・メール中心）をお願いします。丁寧なコミュニケーションができる方を歓迎します。研修制度がありますので未経験でも安心です。',
                  'post_status'  => 'publish',
              ) );
              update_post_meta( $job_id, '_company_user_id', $user_id );
              update_post_meta( $job_id, '_company_name', $company_name );
              update_post_meta( $job_id, '_job_salary', 1500 );
              update_post_meta( $job_id, '_job_type', '完全在宅・シフト制' );
              update_post_meta( $job_id, '_job_days', '週3日〜' );
              update_post_meta( $job_id, '_job_target', '未経験者歓迎' );
              update_post_meta( $job_id, '_job_category', 'カスタマーサポート' );
              echo "JOB_STATUS=created\n";
              echo "JOB_URL=" . get_permalink( $job_id ) . "\n";
          } else {
              $job = $existing_jobs[0];
              echo "JOB_STATUS=already_existed\n";
              echo "JOB_URL=" . get_permalink( $job->ID ) . "\n";
          }
          PHP_SCRIPT
          REMOTE_SCRIPT
