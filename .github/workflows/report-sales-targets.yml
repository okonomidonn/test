name: Report sales targets (まとめ求人の企業ごとの送客の人数)

# 本番から、まとめ求人（他社の求人の紹介）の企業ごとに「応募ページへ進んだ学生の人数」「応募した」「採用」を読み出して、ログに出すだけ。
# - 読むだけで、本番には何も書き込まない。
# - 出すのは企業名・求人の数・人数だけ。学生の名前やメールアドレスなどは出さない。
# 営業先を、学生を送った人数の多い順に選ぶために使う。応募確認メール（2026-11-25 に停止）が止まっているかの確認にも使う。
on:
  workflow_dispatch:
  # 新しいワークフローは、標準のブランチに入るまで手動で動かせないので、このファイルを変えてプッシュしたときにも動かす。
  push:
    branches:
      - claude/zaito-job-site-uqgb9o
    paths:
      - ".github/workflows/report-sales-targets.yml"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Per-company counts (read only)
        run: |
          ssh -i ~/.ssh/deploy_key -o LogLevel=ERROR -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
            'wp --path=zaito-work.com/public_html eval-file -' <<'PHP'
          <?php
          $stats   = (array) get_option( 'zaito_remote_stats', array() );
          $applies = function_exists( 'zaito_ac_counts' ) ? zaito_ac_counts() : array();
          $by = array();
          foreach ( zaito_remote_jobs() as $job ) {
              $co = $job['company'];
              if ( ! isset( $by[ $co ] ) ) $by[ $co ] = array( 'jobs' => 0, 'go' => 0, 'applied' => 0, 'hired' => 0, 'direct' => 0, 'slugs' => array() );
              $by[ $co ]['jobs']++;
              $by[ $co ]['direct'] += empty( $job['direct'] ) ? 0 : 1;
              $by[ $co ]['slugs'][] = $job['slug'];
              $s = isset( $stats[ $job['slug'] ] ) ? $stats[ $job['slug'] ] : array( 'members' => array() );
              $by[ $co ]['go'] += count( (array) $s['members'] );
              $a = isset( $applies[ $job['slug'] ] ) ? $applies[ $job['slug'] ] : array( 'applied' => 0, 'hired' => 0 );
              $by[ $co ]['applied'] += (int) $a['applied'];
              $by[ $co ]['hired']   += (int) $a['hired'];
          }
          uasort( $by, function ( $x, $y ) { return ( $y['go'] - $x['go'] ) ?: ( $y['applied'] - $x['applied'] ); } );
          echo "企業\t求人数\t進んだ学生\t応募した\t採用\t直接掲載\t求人\n";
          foreach ( $by as $co => $c ) {
              echo $co, "\t", $c['jobs'], "\t", $c['go'], "\t", $c['applied'], "\t", $c['hired'], "\t", $c['direct'], "\t", implode( ',', $c['slugs'] ), "\n";
          }
          PHP

      # 「応募しましたか？」のメール（inc/apply-track.php）を実際に送っているか。人数と日付だけを出す。
      - name: Apply-check mail stats (read only)
        run: |
          ssh -i ~/.ssh/deploy_key -o LogLevel=ERROR -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
            'wp --path=zaito-work.com/public_html eval-file -' <<'PHP'
          <?php
          $next = wp_next_scheduled( 'zaito_apply_check_daily' );
          echo "次に送る処理が動く時刻: ", $next ? wp_date( 'Y-m-d H:i', $next ) : '予定なし', "\n";
          $ids = get_posts( array( 'post_type' => 'zaito_interest', 'post_status' => 'any', 'posts_per_page' => -1, 'fields' => 'ids', 'meta_key' => 'apply_asked' ) );
          $by_day = array(); $people = 0; $q = array( 1 => 0, 2 => 0 );
          foreach ( $ids as $id ) {
              $a = get_post_meta( $id, 'apply_asked', true );
              if ( ! is_array( $a ) || ! $a ) continue;
              $people++;
              $days = array();
              foreach ( $a as $k => $d ) { $q[ (int) substr( $k, -1 ) ]++; $days[ $d ] = 1; }
              foreach ( array_keys( $days ) as $d ) { $by_day[ $d ] = ( $by_day[ $d ] ?? 0 ) + 1; }
          }
          echo "メールを受け取った学生: {$people}人（聞いた件数：応募したか {$q[1]}件、選考の結果 {$q[2]}件）\n";
          ksort( $by_day );
          echo "日ごとの送った人数（直近20日）:\n";
          foreach ( array_slice( $by_day, -20, null, true ) as $d => $n ) echo "  {$d}: {$n}人\n";
          $ans = array();
          foreach ( (array) get_option( 'zaito_apply_stats', array() ) as $slug => $rows ) foreach ( (array) $rows as $r ) { $ans[ $r['status'] ] = ( $ans[ $r['status'] ] ?? 0 ) + 1; }
          echo "答え（件数）: "; foreach ( $ans as $s => $n ) echo "{$s}={$n} "; echo "\n";
          $clicked = count( get_posts( array( 'post_type' => 'zaito_interest', 'post_status' => 'any', 'posts_per_page' => -1, 'fields' => 'ids', 'meta_key' => 'remote_clicks' ) ) );
          echo "応募ページへ進んだことがある学生: {$clicked}人\n";
          PHP

      # マーケティングの方針を考えるための数字（人数の集計だけ。個人の情報は出さない）。
      - name: Registration stats (read only)
        run: |
          ssh -i ~/.ssh/deploy_key -o LogLevel=ERROR -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
            'wp --path=zaito-work.com/public_html eval-file -' <<'PHP'
          <?php
          $d = zaito_stats_data( 60 );
          $r = $d['registrations'];
          unset( $r['recent_by_ad'] );
          $by_week = array();
          foreach ( (array) $r['new_by_day'] as $day => $n ) { $w = date( 'Y-m-d', strtotime( 'monday this week', strtotime( $day ) ) ); $by_week[ $w ] = ( $by_week[ $w ] ?? 0 ) + (int) $n; }
          unset( $r['new_by_day'] );
          echo "週ごとの新規登録（月曜はじまり）:\n"; foreach ( $by_week as $w => $n ) echo "  {$w}: {$n}\n";
          echo wp_json_encode( $r, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT ), "\n";
          echo "直接掲載: ", wp_json_encode( $d['direct'], JSON_UNESCAPED_UNICODE ), "\n";
          echo "メール配信: ", wp_json_encode( $d['mail_campaigns'], JSON_UNESCAPED_UNICODE ), "\n";
          PHP
