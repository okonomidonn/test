name: Deploy WordPress Theme to XServer

on:
  push:
    branches:
      - claude/zaito-job-site-uqgb9o
    paths:
      - "wordpress-theme/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote theme directory exists
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
            "mkdir -p zaito-work.com/public_html/wp-content/themes/zaito"

      - name: Install PHP libraries (Anthropic SDK)
        run: |
          cd wordpress-theme/zaito
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          # ライブラリのファイルをURLで直接開けないようにする。
          printf 'Require all denied\n' > vendor/.htaccess

      - name: Write API key outside public_html (only when the secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set. Recommendations use the rule-based fallback."
            exit 0
          fi
          # キーはコマンドの引数に出さず、標準入力で渡す。ファイルは本人だけが読めるようにする。
          printf "<?php\ndefine( 'ZAITO_ANTHROPIC_API_KEY', '%s' );\n" "$ANTHROPIC_API_KEY" | \
            ssh -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
            'umask 077; cat > zaito-work.com/zaito-secrets.php'

      - name: Deploy theme via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.XSERVER_PORT }}" \
            wordpress-theme/zaito/ \
            ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:zaito-work.com/public_html/wp-content/themes/zaito/

      # 反映したページを IndexNow で Bing などに知らせる（ChatGPT の検索は Bing の結果を土台にしているため）。
      # キーは公開してよい値で、テーマの inc/indexnow.php にある。失敗しても反映そのものは成功のままにする。
      - name: Notify search engines via IndexNow
        continue-on-error: true
        run: |
          KEY=$(grep -o "ZAITO_INDEXNOW_KEY', '[0-9a-f]*" wordpress-theme/zaito/inc/indexnow.php | grep -o '[0-9a-f]*$')
          SITE=https://zaito-work.com
          # 確認用ファイルが本番で返るまで少し待つ。
          for i in 1 2 3 4 5 6; do
            [ "$(curl -s "$SITE/$KEY.txt")" = "$KEY" ] && break
            sleep 10
          done
          URLS=$(curl -s "$SITE/wp-sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | while read -r sm; do curl -s "$sm" | grep -o '<loc>[^<]*' | sed 's/<loc>//'; done)
          COUNT=$(printf '%s\n' "$URLS" | grep -c '^https://')
          echo "Submitting $COUNT URLs"
          printf '%s\n' "$URLS" | python3 -c "import json,sys; urls=[u.strip() for u in sys.stdin if u.strip().startswith('https://')]; print(json.dumps({'host':'zaito-work.com','key':sys.argv[1],'keyLocation':'https://zaito-work.com/'+sys.argv[1]+'.txt','urlList':urls}))" "$KEY" > indexnow.json
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json
