name: Deploy WordPress Theme to XServer

on:
  push:
    branches:
      - claude/zaito-job-site-uqgb9o
    paths:
      - "wordpress-theme/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.XSERVER_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy theme via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.XSERVER_PORT }}" \
            wordpress-theme/zaito/ \
            ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:public_html/wp-content/themes/zaito/
